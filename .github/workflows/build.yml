name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reuse:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
    - uses: fsfe/reuse-action@v6

  clang-format:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install clang-format-19
      run: |
        wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main'
        sudo apt-get update
        sudo apt-get install -y clang-format-19

    - name: Check formatting
      run: |
        find src -name '*.cpp' -o -name '*.h' \
          | xargs clang-format-19 --dry-run --Werror

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            artifact: game-server-linux
          - name: Windows
            os: windows-2022
            artifact: game-server-windows

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          aqtversion: '==3.3.0'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp build/game-server README.md dist/

      - name: Collect (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/* dist/ -Recurse
          Copy-Item README.md dist/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
